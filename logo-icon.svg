<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Jeux Multijoueur">
  <defs>
    <linearGradient id="g-hub" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Spokes (liens vers les joueurs) -->
  <g stroke-linecap="round" filter="url(#glow)">
    <line x1="32" y1="32" x2="32"   y2="11"   stroke="#7c5cff" stroke-width="3"/>
    <line x1="32" y1="32" x2="13.8" y2="42.5" stroke="#22d3ee" stroke-width="3"/>
    <line x1="32" y1="32" x2="50.2" y2="42.5" stroke="#ff4d9d" stroke-width="3"/>
  </g>

  <!-- Joueurs -->
  <g filter="url(#glow)">
    <circle cx="32"   cy="11"   r="4.6" fill="#7c5cff"/>
    <circle cx="13.8" cy="42.5" r="4.6" fill="#22d3ee"/>
    <circle cx="50.2" cy="42.5" r="4.6" fill="#ff4d9d"/>
  </g>

  <!-- Hub de partie -->
  <circle cx="32" cy="32" r="11.5" fill="url(#g-hub)" filter="url(#glow)"/>
  <circle cx="32" cy="32" r="11.5" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.2"/>

  <!-- Bouton play -->
  <path d="M29 27 L29 37 L38 32 Z" fill="#ffffff"
        stroke="#ffffff" stroke-width="2.4" stroke-linejoin="round"/>
</svg>
