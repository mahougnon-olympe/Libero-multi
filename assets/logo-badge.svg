<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Jeux Multijoueur">
  <defs>
    <linearGradient id="g-hub-b" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="g-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0.5"/>
    </linearGradient>
    <filter id="glow-b" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Tuile sombre -->
  <rect x="1" y="1" width="62" height="62" rx="16" fill="#0e0e1c"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="15.5" fill="none" stroke="url(#g-tile)" stroke-width="1.2"/>

  <!-- Spokes -->
  <g stroke-linecap="round">
    <line x1="32" y1="32" x2="32"   y2="13"   stroke="#7c5cff" stroke-width="2.8"/>
    <line x1="32" y1="32" x2="15.5" y2="41.5" stroke="#22d3ee" stroke-width="2.8"/>
    <line x1="32" y1="32" x2="48.5" y2="41.5" stroke="#ff4d9d" stroke-width="2.8"/>
  </g>

  <!-- Joueurs -->
  <g filter="url(#glow-b)">
    <circle cx="32"   cy="13"   r="4.2" fill="#7c5cff"/>
    <circle cx="15.5" cy="41.5" r="4.2" fill="#22d3ee"/>
    <circle cx="48.5" cy="41.5" r="4.2" fill="#ff4d9d"/>
  </g>

  <!-- Hub -->
  <circle cx="32" cy="32" r="10.5" fill="url(#g-hub-b)" filter="url(#glow-b)"/>
  <circle cx="32" cy="32" r="10.5" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.1"/>

  <!-- Play -->
  <path d="M29.5 27.5 L29.5 36.5 L37.5 32 Z" fill="#ffffff"
        stroke="#ffffff" stroke-width="2.2" stroke-linejoin="round"/>
</svg>
